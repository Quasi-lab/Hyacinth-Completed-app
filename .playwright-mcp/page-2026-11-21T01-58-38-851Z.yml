            - generic [ref=f1e98]: Executive Operational Briefing · Clinical Intelligence Architecture
            - heading "Hyacinth Clinic Operations & Financial Analytics" [level=1] [ref=f1e101]
            - paragraph [ref=f1e102]:
              - text: Welcome to the centralized management ecosystem for
              - strong [ref=f1e103]: Hyacinth Clinic
              - text: . This real-time platform unifies the clinic's transactional fact admissions with multidimensional clinical registries—integrating patient demographics, physician specialties, nursing ward allocations, room bed capacities, and itemized billing ledgers into actionable operational intelligence.
            - paragraph [ref=f1e104]: By transforming raw healthcare records into live visual metrics, Hyacinth Clinic ensures patient-centered care delivery, transparent billing governance, optimized ward throughput, and long-term fiscal resilience.
          - generic [ref=f1e105]:
            - generic [ref=f1e111]:
              - heading "The 5W's and H Framework" [level=2] [ref=f1e112]
              - paragraph [ref=f1e113]: System architecture, purpose, operational timeline, and execution methodology
            - generic [ref=f1e114]:
              - generic [ref=f1e115]:
                - heading "Who Is Involved" [level=3] [ref=f1e122]
                - paragraph [ref=f1e123]: Medical directors, attending physicians across 8 clinical specialties, supervising ward nurses, financial controllers, and clinic admissions coordinators orchestrating inpatient and outpatient journeys.
              - generic [ref=f1e124]:
                - heading "What It Delivers" [level=3] [ref=f1e131]
                - paragraph [ref=f1e132]:
                  - text: A comprehensive relational star-schema warehouse (
                  - code [ref=f1e133]: PatientRecords
                  - text: fact table joined with 5 dimensional tables) paired with live financial cost timelines, doctor caseload metrics, and affliction distributions.
              - generic [ref=f1e134]:
                - heading "Where It Operates" [level=3] [ref=f1e140]
                - paragraph [ref=f1e141]: "Implemented across Hyacinth Clinic's specialized departments: ICU Suites, Standard Patient Rooms, Semi-Private facilities, General Wards, emergency triage stations, and central billing administration."
              - generic [ref=f1e142]:
                - heading "When It Updates" [level=3] [ref=f1e148]
                - paragraph [ref=f1e149]: Operates in real time with continuous Supabase REST polling, configurable automatic refresh intervals (15s, 30s, 60s, or manual sync), and instant updates upon logging clinical admissions.
              - generic [ref=f1e150]:
                - heading "Why It Matters" [level=3] [ref=f1e157]
                - paragraph [ref=f1e158]: Modern clinics struggle with isolated billing records and bottlenecked bed allocations. This dashboard bridges financial metrics with clinical workflow, preventing physician burnout and eliminating revenue leakage.
              - generic [ref=f1e159]:
                - heading "How It Functions" [level=3] [ref=f1e165]
                - paragraph [ref=f1e166]:
                  - text: Powered by a full-stack React SPA running on Express with direct Supabase REST endpoints, client-side
                  - code [ref=f1e167]: "@supabase/supabase-js"
                  - text: integration, and interactive custom SVG charts.
          - generic [ref=f1e168]:
            - generic [ref=f1e174]:
              - heading "Key Beneficiaries & Impact" [level=2] [ref=f1e175]
              - paragraph [ref=f1e176]: Measurable value delivered to patients, medical staff, and executive leadership
            - generic [ref=f1e177]:
