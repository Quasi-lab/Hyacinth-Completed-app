            - heading "Hyacinth Clinic Operations & Financial Analytics" [level=1] [ref=e95]
            - paragraph [ref=e96]:
              - text: Welcome to the centralized management ecosystem for
              - strong [ref=e97]: Hyacinth Clinic
              - text: . This real-time platform unifies the clinic's transactional fact admissions with multidimensional clinical registries—integrating patient demographics, physician specialties, nursing ward allocations, room bed capacities, and itemized billing ledgers into actionable operational intelligence.
            - paragraph [ref=e98]: By transforming raw healthcare records into live visual metrics, Hyacinth Clinic ensures patient-centered care delivery, transparent billing governance, optimized ward throughput, and long-term fiscal resilience.
          - generic [ref=e99]:
            - generic [ref=e105]:
              - heading "The 5W's and H Framework" [level=2] [ref=e106]
              - paragraph [ref=e107]: System architecture, purpose, operational timeline, and execution methodology
            - generic [ref=e108]:
              - generic [ref=e109]:
                - heading "Who Is Involved" [level=3] [ref=e116]
                - paragraph [ref=e117]: Medical directors, attending physicians across 8 clinical specialties, supervising ward nurses, financial controllers, and clinic admissions coordinators orchestrating inpatient and outpatient journeys.
              - generic [ref=e118]:
                - heading "What It Delivers" [level=3] [ref=e125]
                - paragraph [ref=e126]:
                  - text: A comprehensive relational star-schema warehouse (
                  - code [ref=e127]: PatientRecords
                  - text: fact table joined with 5 dimensional tables) paired with live financial cost timelines, doctor caseload metrics, and affliction distributions.
              - generic [ref=e128]:
                - heading "Where It Operates" [level=3] [ref=e134]
                - paragraph [ref=e135]: "Implemented across Hyacinth Clinic's specialized departments: ICU Suites, Standard Patient Rooms, Semi-Private facilities, General Wards, emergency triage stations, and central billing administration."
              - generic [ref=e136]:
                - heading "When It Updates" [level=3] [ref=e142]
                - paragraph [ref=e143]: Operates in real time with continuous Supabase REST polling, configurable automatic refresh intervals (15s, 30s, 60s, or manual sync), and instant updates upon logging clinical admissions.
              - generic [ref=e144]:
                - heading "Why It Matters" [level=3] [ref=e151]
                - paragraph [ref=e152]: Modern clinics struggle with isolated billing records and bottlenecked bed allocations. This dashboard bridges financial metrics with clinical workflow, preventing physician burnout and eliminating revenue leakage.
              - generic [ref=e153]:
                - heading "How It Functions" [level=3] [ref=e159]
                - paragraph [ref=e160]:
                  - text: Powered by a full-stack React SPA running on Express with direct Supabase REST endpoints, client-side
                  - code [ref=e161]: "@supabase/supabase-js"
                  - text: integration, and interactive custom SVG charts.
          - generic [ref=e162]:
